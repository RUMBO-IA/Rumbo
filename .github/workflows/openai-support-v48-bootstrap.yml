name: RUMBO OpenAI Support V48 Clean Rematerializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/openai-support-v48-bootstrap.yml"

permissions:
  contents: write

jobs:
  rematerialize:
    if: >-
      github.actor == 'fscfede-beep' &&
      github.event.pull_request.head.repo.full_name == 'RUMBO-IA/Rumbo' &&
      github.event.pull_request.head.ref == 'bootstrap/openai-support-v48-clean-20261005' &&
      github.event.pull_request.base.sha == 'bbfcd95a986c5c617abfdf25b1ac769e7a7a9b3e'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOOTSTRAP_HEAD: \${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bbfcd95a986c5c617abfdf25b1ac769e7a7a9b3e
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Rematerialize exact OpenAI support alignment candidate
        shell: bash
        run: |
          set -euo pipefail

          base="bbfcd95a986c5c617abfdf25b1ac769e7a7a9b3e"
          source_branch="fix/openai-support-brand-alignment-v48-20261004"
          source_head="785e402f596c29bc11db6effde415326301eeeaf"
          bootstrap_branch="bootstrap/openai-support-v48-clean-20261005"
          clean_branch="fix/openai-support-brand-alignment-v48-clean-20261005"

          test "$(git rev-parse HEAD)" = "$base"
          test "$(git ls-remote origin "refs/heads/$bootstrap_branch" | awk '{print $1}')" = "$BOOTSTRAP_HEAD"
          test "$(git ls-remote origin "refs/heads/$source_branch" | awk '{print $1}')" = "$source_head"
          if git ls-remote --exit-code --heads origin "refs/heads/$clean_branch" >/dev/null 2>&1; then
            echo "FAIL_CLOSED_CLEAN_BRANCH_EXISTS" >&2
            exit 3
          fi

          git fetch origin "$source_head" --quiet

          expected="$(printf '%s\n' \
            '.github/workflows/brand-gate.yml' \
            'openai-support.html' \
            'scripts/test_verify_brand_contract.py' \
            'scripts/verify_brand_contract.py')"
          changed="$(git diff --name-only "$base" "$source_head" | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse "$source_head:.github/workflows/brand-gate.yml")" = "8ac039883eb37484c1b7463f7a65e02f880a2065"
          test "$(git rev-parse "$source_head:openai-support.html")" = "0f595c936194082f206542a1401baa5ed711c576"
          test "$(git rev-parse "$source_head:scripts/test_verify_brand_contract.py")" = "b7f492f3e5779b847f9e78ace6364ff14951d61e"
          test "$(git rev-parse "$source_head:scripts/verify_brand_contract.py")" = "25cb961b4485673ad1c67cd7aeac3f5a6a4cd300"

          git switch --detach "$base"
          git switch -c "$clean_branch"

          git show "$source_head:.github/workflows/brand-gate.yml" > .github/workflows/brand-gate.yml
          git show "$source_head:openai-support.html" > openai-support.html
          git show "$source_head:scripts/test_verify_brand_contract.py" > scripts/test_verify_brand_contract.py
          git show "$source_head:scripts/verify_brand_contract.py" > scripts/verify_brand_contract.py

          git add -- .github/workflows/brand-gate.yml openai-support.html scripts/test_verify_brand_contract.py scripts/verify_brand_contract.py
          staged="$(git diff --cached --name-only | sort)"
          test "$staged" = "$expected"

          python -m py_compile scripts/verify_brand_contract.py scripts/test_verify_brand_contract.py
          python -m unittest scripts.test_verify_brand_contract -v
          python scripts/verify_brand_contract.py

          git -c core.hooksPath=/dev/null \
              -c user.name="RUMBO Privacy Automation" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "fix(openai): align support surface with Operational AI Systems"

          clean_sha="$(git rev-parse HEAD)"
          meta="$(git show -s --format='%an|%ae|%cn|%ce' HEAD)"
          test "$meta" = "RUMBO Privacy Automation|41898282+github-actions[bot]@users.noreply.github.com|RUMBO Privacy Automation|41898282+github-actions[bot]@users.noreply.github.com"

          python scripts/test_verify_public_privacy.py
          git diff "$base" "$clean_sha" --check

          git push --set-upstream origin "$clean_branch"
          test "$(git ls-remote origin "refs/heads/$clean_branch" | awk '{print $1}')" = "$clean_sha"

          git push origin --delete "$source_branch"
          git push origin --delete "$bootstrap_branch"

          echo "CLEAN_OPENAI_SUPPORT_V48_SHA=$clean_sha"
