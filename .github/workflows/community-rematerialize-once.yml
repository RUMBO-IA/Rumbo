name: One-time quarantined branch cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.repository == 'RUMBO-IA/Rumbo' &&
      github.event.pull_request.number == 323 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/community-labs-v1-2026-10-07' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact quarantined head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify clean replacement and delete quarantined branch
        shell: bash
        env:
          EXPECTED_BASE: 525b152bb6679db887c1d8c4f28bf993bda294ad
          EXPECTED_CLEAN: 9d2600b8909879621ffe20f09035dc8a7a4e45f8
          SOURCE_BRANCH: feat/community-labs-v1-2026-10-07
          CLEAN_BRANCH: feat/community-labs-v1-clean-2026-10-07
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD"
          git fetch origin main "$CLEAN_BRANCH" --quiet

          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test "$(git rev-parse "origin/$CLEAN_BRANCH")" = "$EXPECTED_CLEAN"

          observed_source="$(git ls-remote --heads origin "refs/heads/$SOURCE_BRANCH" | awk '{print $1}')"
          test "$observed_source" = "$EXPECTED_SOURCE_HEAD"

          git push origin ":refs/heads/$SOURCE_BRANCH"

          if git ls-remote --exit-code --heads origin "refs/heads/$SOURCE_BRANCH" >/dev/null 2>&1; then
            echo "SOURCE_BRANCH_STILL_PRESENT"
            exit 13
          fi

          echo "QUARANTINED_BRANCH_DELETED"
