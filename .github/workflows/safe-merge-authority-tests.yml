name: Safe Merge Authority tests
on:
  push:
    branches:
      - "tdd/safe-merge-evidence-fallback-v2"
  pull_request:
    branches: [main]
    paths:
      - "scripts/safe_merge_*.py"
      - ".github/workflows/safe-merge-authority-tests.yml"
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m unittest scripts.test_safe_merge_authority.AuthorityGateTests.test_operational_branch_safety_can_replace_unreadable_admin_readback -v
