name: RUMBO Trust Center V51 Clean Rematerializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/trust-center-v51-bootstrap.yml"
      - "README.md"
      - "continuity.html"
      - "incident-response.html"
      - "index.html"
      - "openai-privacy.html"
      - "openai-terms.html"
      - "privacy.html"
      - "processing-terms.html"
      - "responsible-ai.html"
      - "retention.html"
      - "scripts/test_verify_brand_contract.py"
      - "scripts/verify_brand_contract.py"
      - "security.html"
      - "status.html"
      - "subprocessors.html"
      - "support-policy.html"
      - "trust-center.html"

permissions:
  contents: write

jobs:
  rematerialize:
    if: >-
      github.actor == 'fscfede-beep' &&
      github.event.pull_request.head.repo.full_name == 'RUMBO-IA/Rumbo' &&
      github.event.pull_request.head.ref == 'ops/production-authority-v50-clean-r1-20261005' &&
      github.event.pull_request.base.sha == '014893b85384ddb9b13ed2a623edc02627fe0478'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 014893b85384ddb9b13ed2a623edc02627fe0478
          fetch-depth: 0
          persist-credentials: true
      - name: Validate source and rematerialize clean trust candidate
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          temp_branch="ops/production-authority-v50-clean-r1-20261005"
          clean_branch="fix/trust-center-v51-clean-20261005"
          base="014893b85384ddb9b13ed2a623edc02627fe0478"
          bootstrap=".github/workflows/trust-center-v51-bootstrap.yml"

          [[ "$SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git ls-remote origin "refs/heads/$temp_branch" | awk '{print $1}')" = "$SOURCE_HEAD"
          if git ls-remote --exit-code --heads origin "refs/heads/$clean_branch" >/dev/null 2>&1; then
            echo "FAIL_CLOSED_CLEAN_BRANCH_EXISTS" >&2
            exit 3
          fi

          git fetch origin "$SOURCE_HEAD" --quiet
          mapfile -t changed < <(git diff --name-only "$base" "$SOURCE_HEAD" | sort)
          expected=(
            "$bootstrap"
            "README.md"
            "continuity.html"
            "incident-response.html"
            "index.html"
            "openai-privacy.html"
            "openai-terms.html"
            "privacy.html"
            "processing-terms.html"
            "responsible-ai.html"
            "retention.html"
            "scripts/test_verify_brand_contract.py"
            "scripts/verify_brand_contract.py"
            "security.html"
            "status.html"
            "subprocessors.html"
            "support-policy.html"
            "trust-center.html"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done

          git diff --exit-code "$base" "$SOURCE_HEAD" -- docs/brand/production_lock_v1.json vercel.json terms.html refund.html support.html portal.js
          ! git show "$SOURCE_HEAD:README.md" | grep -Fiq 'Human-controlled AI CRM and workflow automation for small businesses in Latin America'
          ! git show "$SOURCE_HEAD:security.html" | grep -Fiq 'commercial CRM/automation product'
          git show "$SOURCE_HEAD:README.md" | grep -Fqi 'Operational AI Systems'
          git show "$SOURCE_HEAD:README.md" | grep -Fqi 'Revenue Recovery'
          git show "$SOURCE_HEAD:README.md" | grep -Fqi 'Agent Reliability'
          git show "$SOURCE_HEAD:README.md" | grep -Fqi 'Guardian'

          git switch --detach "$base"
          git switch -c "$clean_branch"
          files=(
            "README.md"
            "continuity.html"
            "incident-response.html"
            "index.html"
            "openai-privacy.html"
            "openai-terms.html"
            "privacy.html"
            "processing-terms.html"
            "responsible-ai.html"
            "retention.html"
            "scripts/test_verify_brand_contract.py"
            "scripts/verify_brand_contract.py"
            "security.html"
            "status.html"
            "subprocessors.html"
            "support-policy.html"
            "trust-center.html"
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$SOURCE_HEAD:$path" > "$path"
          done
          git add -- "${files[@]}"

          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected_clean=(
            "README.md"
            "continuity.html"
            "incident-response.html"
            "index.html"
            "openai-privacy.html"
            "openai-terms.html"
            "privacy.html"
            "processing-terms.html"
            "responsible-ai.html"
            "retention.html"
            "scripts/test_verify_brand_contract.py"
            "scripts/verify_brand_contract.py"
            "security.html"
            "status.html"
            "subprocessors.html"
            "support-policy.html"
            "trust-center.html"
          )
          test "${#staged[@]}" -eq "${#expected_clean[@]}"
          for i in "${!expected_clean[@]}"; do test "${staged[$i]}" = "${expected_clean[$i]}"; done
          git diff --cached --check

          python -m unittest scripts.test_verify_brand_contract -v
          python scripts/verify_brand_contract.py
          python scripts/verify_security_headers.py

          git -c core.hooksPath=/dev/null \
              -c user.name="RUMBO Privacy Automation" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "feat(trust): publish enterprise readiness Trust Center V51"

          clean_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$base"
          meta="$(git show -s --format='%an|%ae|%cn|%ce' HEAD)"
          test "$meta" = "RUMBO Privacy Automation|41898282+github-actions[bot]@users.noreply.github.com|RUMBO Privacy Automation|41898282+github-actions[bot]@users.noreply.github.com"

          git push --set-upstream origin "$clean_branch"
          test "$(git ls-remote origin "refs/heads/$clean_branch" | awk '{print $1}')" = "$clean_sha"
          git push origin --delete "$temp_branch"
          echo "CLEAN_TRUST_CENTER_V51_SHA=$clean_sha"
