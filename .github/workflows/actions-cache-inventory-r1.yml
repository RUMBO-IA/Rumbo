name: RUMBO Actions Cache Prune R1

on:
  push:
    branches:
      - ops/actions-cache-inventory-r1-20261007

permissions:
  actions: write
  contents: read

concurrency:
  group: rumbo-actions-cache-prune-r1
  cancel-in-progress: true

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prune old CodeQL caches conservatively
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "rumbo-cache-prune-r1",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  if resp.status == 204:
                      return None
                  return json.load(resp)

          def list_caches():
              items = []
              page = 1
              while True:
                  payload = request(f"{api}/actions/caches?per_page=100&page={page}")
                  batch = payload.get("actions_caches", [])
                  items.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
                  if page > 50:
                      raise RuntimeError("cache pagination exceeded fail-closed page cap")
              return items

          before = list_caches()
          before_total = sum(int(x.get("size_in_bytes") or 0) for x in before)

          allowed_prefix = "codeql-overlay-base-database-"
          allowed_ref = "refs/heads/main"
          grouped = {}
          untouched = []

          for item in before:
              key = item.get("key") or ""
              ref = item.get("ref")
              if not key.startswith(allowed_prefix) or ref != allowed_ref:
                  untouched.append(item)
                  continue
              match = re.search(r"-(javascript|python)-", key)
              if not match:
                  untouched.append(item)
                  continue
              grouped.setdefault(match.group(1), []).append(item)

          delete = []
          keep = []
          for language, items in sorted(grouped.items()):
              items.sort(key=lambda x: x.get("created_at") or "", reverse=True)
              keep.extend(items[:2])
              delete.extend(items[2:])

          if untouched:
              print("UNTOUCHED_NON_POLICY_CACHE_COUNT=" + str(len(untouched)))

          if len(before) != len(keep) + len(delete) + len(untouched):
              raise RuntimeError("cache classification mismatch")

          delete_bytes = sum(int(x.get("size_in_bytes") or 0) for x in delete)
          print("RUMBO_ACTIONS_CACHE_PRUNE_V1")
          print("before_count=" + str(len(before)))
          print("before_total_bytes=" + str(before_total))
          print("before_total_mib=" + f"{before_total / 1024 / 1024:.2f}")
          print("keep_count=" + str(len(keep)))
          print("delete_count=" + str(len(delete)))
          print("delete_bytes=" + str(delete_bytes))
          print("delete_mib=" + f"{delete_bytes / 1024 / 1024:.2f}")

          # Fail closed unless the inventory matches the audited shape.
          if len(before) != 76:
              raise RuntimeError(f"unexpected cache count: {len(before)} != 76")
          if len(delete) != 72 or len(keep) != 4:
              raise RuntimeError(
                  f"unexpected prune shape: delete={len(delete)} keep={len(keep)}"
              )
          if delete_bytes < 700 * 1024 * 1024:
              raise RuntimeError("deletion volume below audited minimum")
          if untouched:
              raise RuntimeError("unexpected non-policy caches present")

          for item in delete:
              cache_id = int(item["id"])
              key = item.get("key") or ""
              if not key.startswith(allowed_prefix) or item.get("ref") != allowed_ref:
                  raise RuntimeError("policy drift before deletion")
              request(f"{api}/actions/caches/{cache_id}", method="DELETE")
              print("DELETED_CACHE_ID=" + str(cache_id))

          after = list_caches()
          after_total = sum(int(x.get("size_in_bytes") or 0) for x in after)
          print("after_count=" + str(len(after)))
          print("after_total_bytes=" + str(after_total))
          print("after_total_mib=" + f"{after_total / 1024 / 1024:.2f}")

          if len(after) > 4:
              raise RuntimeError(f"post-prune cache count too high: {len(after)}")
          if after_total > 60 * 1024 * 1024:
              raise RuntimeError("post-prune cache storage above conservative target")
          PY
