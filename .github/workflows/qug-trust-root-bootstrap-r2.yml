name: RUMBO QUG Trust Root Clean Bootstrap R2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/qug-protected-trust-root-r1.yml"
      - ".github/workflows/qug-trust-root-bootstrap-r2.yml"

permissions:
  contents: write

jobs:
  rematerialize-clean:
    if: >-
      github.event.pull_request.number == 210 &&
      github.actor == 'fscfede-beep' &&
      github.event.pull_request.head.repo.full_name == 'RUMBO-IA/Rumbo' &&
      github.event.pull_request.head.ref == 'fix/qug-protected-trust-root-bootstrap-r2-20261004' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.sha == '68476a8e179d8db803bd3daeefa69a42a63fa098'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact public base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 68476a8e179d8db803bd3daeefa69a42a63fa098
          fetch-depth: 0
          persist-credentials: true

      - name: Verify lineage and rematerialize exact clean candidate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "68476a8e179d8db803bd3daeefa69a42a63fa098"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin "$HEAD_SHA" --quiet

          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)
          expected=(
            ".github/workflows/qug-protected-trust-root-r1.yml"
            ".github/workflows/qug-trust-root-bootstrap-r2.yml"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done

          git show "$HEAD_SHA:.github/workflows/qug-protected-trust-root-r1.yml" > "$RUNNER_TEMP/qug-protected-trust-root-r1.yml"
          test -s "$RUNNER_TEMP/qug-protected-trust-root-r1.yml"

          git switch --detach "$BASE_SHA"
          git switch -c "fix/qug-protected-trust-root-clean-r2-20261004"
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/qug-protected-trust-root-r1.yml" ".github/workflows/qug-protected-trust-root-r1.yml"
          git add -- ".github/workflows/qug-protected-trust-root-r1.yml"
          test "$(git diff --cached --name-only)" = ".github/workflows/qug-protected-trust-root-r1.yml"

          git -c core.hooksPath=/dev/null \
              -c user.name="RUMBO Privacy Automation" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "ci(authority): rematerialize clean protected-public QUG trust root R1"

          if git ls-remote --exit-code --heads origin "refs/heads/fix/qug-protected-trust-root-clean-r2-20261004" >/dev/null 2>&1; then
            git fetch origin "fix/qug-protected-trust-root-clean-r2-20261004" --quiet
            test "$(git rev-parse "origin/fix/qug-protected-trust-root-clean-r2-20261004^{tree}")" = "$(git rev-parse HEAD^{tree})"
          else
            git push --set-upstream origin "fix/qug-protected-trust-root-clean-r2-20261004"
          fi

          test "$(git ls-remote origin "refs/heads/fix/qug-protected-trust-root-clean-r2-20261004" | awk '{print $1}')" = "$(git rev-parse HEAD)"
          git push origin --delete "fix/qug-protected-trust-root-bootstrap-r2-20261004"
