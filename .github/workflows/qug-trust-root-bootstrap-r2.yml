name: RUMBO QUG Trust Root Dirty-Ref Cleanup R3

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/qug-trust-root-bootstrap-r2.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event.pull_request.number == 210 &&
      github.actor == 'fscfede-beep' &&
      github.event.pull_request.head.repo.full_name == 'RUMBO-IA/Rumbo' &&
      github.event.pull_request.head.ref == 'fix/qug-protected-trust-root-bootstrap-r2-20261004' &&
      github.event.pull_request.base.sha == '68476a8e179d8db803bd3daeefa69a42a63fa098'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact public base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 68476a8e179d8db803bd3daeefa69a42a63fa098
          fetch-depth: 0
          persist-credentials: true

      - name: Prove clean replacement and delete only dirty bootstrap ref
        env:
          DIRTY_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          dirty_branch="fix/qug-protected-trust-root-bootstrap-r2-20261004"
          clean_branch="fix/qug-protected-trust-root-clean-r2-20261004"
          expected_clean="b70d90ee6a68d80cc6f743048525805ef775b33a"
          expected_blob="19c5500ffe1328f00b8698575442e899c38cc29d"

          [[ "$DIRTY_HEAD" =~ ^[0-9a-f]{40}$ ]]
          dirty_remote="$(git ls-remote origin "refs/heads/$dirty_branch" | awk '{print $1}')"
          test "$dirty_remote" = "$DIRTY_HEAD"

          clean_remote="$(git ls-remote origin "refs/heads/$clean_branch" | awk '{print $1}')"
          test "$clean_remote" = "$expected_clean"
          git fetch origin "$clean_remote" --quiet
          test "$(git rev-parse "$clean_remote:.github/workflows/qug-protected-trust-root-r1.yml")" = "$expected_blob"

          git push origin --delete "$dirty_branch"
          test -z "$(git ls-remote origin "refs/heads/$dirty_branch")"
          echo "DIRTY_BOOTSTRAP_REF_REMOVED=PASS"
