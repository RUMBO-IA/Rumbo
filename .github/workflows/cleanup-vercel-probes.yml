name: Cleanup Vercel probes
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/cleanup-vercel-probes.yml"
permissions:
  contents: write
jobs:
  cleanup:
    if: >-
      github.actor == 'fscfede-beep' &&
      github.event.pull_request.head.repo.full_name == 'RUMBO-IA/Rumbo' &&
      github.event.pull_request.head.ref == 'cleanup/vercel-probes-20261004' &&
      github.event.pull_request.base.sha == '68476a8e179d8db803bd3daeefa69a42a63fa098'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete bounded probe refs and cleanup branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for ref in             "probe/vercel-git-block-safe-merge-v2-20261004"             "probe/vercel-git-block-status-v2-20261004"             "probe/vercel-ignore-status-v2-20261004"
          do
            encoded="$(python - "$ref" <<'PY'
import sys, urllib.parse
print(urllib.parse.quote(sys.argv[1], safe=''))
PY
)"
            code="$(gh api -i "repos/RUMBO-IA/Rumbo/git/ref/heads/$encoded" 2>/dev/null | head -n1 | awk '{print $2}' || true)"
            if [ "$code" = "200" ]; then
              gh api --method DELETE "repos/RUMBO-IA/Rumbo/git/refs/heads/$encoded"
              echo "DELETED=$ref"
            else
              echo "ABSENT=$ref"
            fi
          done
          gh api --method DELETE "repos/RUMBO-IA/Rumbo/git/refs/heads/cleanup%2Fvercel-probes-20261004"
          echo "CLEANUP_BRANCH_DELETED=PASS"
