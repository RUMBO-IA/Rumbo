name: Cleanup Vercel probes
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/cleanup-vercel-probes.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.actor == 'fscfede-beep' &&
      github.event.pull_request.head.repo.full_name == 'RUMBO-IA/Rumbo' &&
      github.event.pull_request.head.ref == 'cleanup/vercel-probes-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete bounded probe refs and cleanup branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for ref in             probe/vercel-git-block-safe-merge-v2-20261004             probe/vercel-git-block-status-v2-20261004             probe/vercel-ignore-status-v2-20261004
          do
            encoded="${ref//\//%2F}"
            gh api --method DELETE "repos/RUMBO-IA/Rumbo/git/refs/heads/$encoded" >/dev/null 2>&1 || true
            echo "CLEANED=$ref"
          done
          gh api --method DELETE "repos/RUMBO-IA/Rumbo/git/refs/heads/cleanup%2Fvercel-probes-20261004"
          echo "CLEANUP_BRANCH_DELETED=PASS"
