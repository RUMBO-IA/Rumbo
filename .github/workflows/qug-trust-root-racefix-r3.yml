name: RUMBO QUG Trust Root Racefix Rematerialize R3

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/qug-protected-trust-root-r1.yml"
      - ".github/workflows/qug-trust-root-racefix-r3.yml"

permissions:
  contents: write

jobs:
  rematerialize:
    if: >-
      github.actor == 'fscfede-beep' &&
      github.event.pull_request.head.repo.full_name == 'RUMBO-IA/Rumbo' &&
      github.event.pull_request.head.ref == 'bootstrap/qug-trust-root-racefix-r3-20261004' &&
      github.event.pull_request.base.sha == '68476a8e179d8db803bd3daeefa69a42a63fa098'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact public base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 68476a8e179d8db803bd3daeefa69a42a63fa098
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact two-file source and create clean R3
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          target=".github/workflows/qug-protected-trust-root-r1.yml"
          temp_branch="bootstrap/qug-trust-root-racefix-r3-20261004"
          clean_branch="fix/qug-protected-trust-root-clean-r3-20261004"
          [[ "$SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git ls-remote origin "refs/heads/$temp_branch" | awk '{print $1}')" = "$SOURCE_HEAD"
          git fetch origin "$SOURCE_HEAD" --quiet

          mapfile -t changed < <(git diff --name-only "68476a8e179d8db803bd3daeefa69a42a63fa098" "$SOURCE_HEAD" | sort)
          expected=(
            ".github/workflows/qug-protected-trust-root-r1.yml"
            ".github/workflows/qug-trust-root-racefix-r3.yml"
          )
          test "${#changed[@]}" -eq 2
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done

          git show "$SOURCE_HEAD:$target" > "$RUNNER_TEMP/qug-protected-trust-root-r1.yml"
          test -s "$RUNNER_TEMP/qug-protected-trust-root-r1.yml"
          if git ls-remote --exit-code --heads origin "refs/heads/$clean_branch" >/dev/null 2>&1; then
            echo "FAIL_CLOSED_CLEAN_R3_ALREADY_EXISTS" >&2
            exit 3
          fi

          git switch --detach "68476a8e179d8db803bd3daeefa69a42a63fa098"
          git switch -c "$clean_branch"
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/qug-protected-trust-root-r1.yml" "$target"
          git add -- "$target"
          test "$(git diff --cached --name-only)" = "$target"
          git -c core.hooksPath=/dev/null               -c user.name="RUMBO Privacy Automation"               -c user.email="41898282+github-actions[bot]@users.noreply.github.com"               commit -m "ci(authority): make public trust-root check wait fail-closed"
          clean_sha="$(git rev-parse HEAD)"
          git push --set-upstream origin "$clean_branch"
          test "$(git ls-remote origin "refs/heads/$clean_branch" | awk '{print $1}')" = "$clean_sha"

          test "$(git ls-remote origin "refs/heads/$temp_branch" | awk '{print $1}')" = "$SOURCE_HEAD"
          git push origin --delete "$temp_branch"
          echo "CLEAN_R3_SHA=$clean_sha"
