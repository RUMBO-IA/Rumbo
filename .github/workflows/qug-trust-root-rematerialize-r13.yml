name: RUMBO QUG Trust Root Rematerialize R13

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/qug-trust-root-rematerialize-r13.yml"

permissions:
  contents: write

jobs:
  rematerialize:
    if: >-
      github.actor == 'fscfede-beep' &&
      github.event.pull_request.head.repo.full_name == 'RUMBO-IA/Rumbo' &&
      github.event.pull_request.head.ref == 'bootstrap/qug-protected-trust-root-r13-20261004' &&
      github.event.pull_request.base.sha == '68476a8e179d8db803bd3daeefa69a42a63fa098'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact public base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 68476a8e179d8db803bd3daeefa69a42a63fa098
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source and create clean R13
        shell: bash
        run: |
          set -euo pipefail
          base="68476a8e179d8db803bd3daeefa69a42a63fa098"
          source_branch="source/qug-protected-trust-root-r13-20261004"
          source_sha="ce1a192e412f1d860ee39b604885adbdb5b0544d"
          bootstrap_branch="bootstrap/qug-protected-trust-root-r13-20261004"
          bootstrap_sha="${{ github.event.pull_request.head.sha }}"
          clean_branch="fix/qug-protected-trust-root-clean-r13-20261004"
          workflow=".github/workflows/qug-protected-trust-root-r1.yml"
          tests="scripts/test_control_authority_anchor.py"
          bootstrap_file=".github/workflows/qug-trust-root-rematerialize-r13.yml"

          [[ "$bootstrap_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(git ls-remote origin "refs/heads/$bootstrap_branch" | awk '{print $1}')" = "$bootstrap_sha"
          test "$(git ls-remote origin "refs/heads/$source_branch" | awk '{print $1}')" = "$source_sha"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$base"
          git fetch origin "$source_sha" "$bootstrap_sha" --quiet

          mapfile -t source_changed < <(git diff --name-only "$base" "$source_sha" | sort)
          test "${#source_changed[@]}" -eq 2
          test "${source_changed[0]}" = "$workflow"
          test "${source_changed[1]}" = "$tests"
          mapfile -t bootstrap_changed < <(git diff --name-only "$base" "$bootstrap_sha" | sort)
          test "${#bootstrap_changed[@]}" -eq 1
          test "${bootstrap_changed[0]}" = "$bootstrap_file"

          git show "$source_sha:$workflow" > "$RUNNER_TEMP/qug-protected-trust-root-r1.yml"
          git show "$source_sha:$tests" > "$RUNNER_TEMP/test_control_authority_anchor.py"

          grep -Fq 'ruleset.get("target") != "branch"' "$RUNNER_TEMP/qug-protected-trust-root-r1.yml"
          grep -Fq '(s.get("creator") or {}).get("avatar_url")' "$RUNNER_TEMP/qug-protected-trust-root-r1.yml"
          grep -Fq 'include\.path|includeif\..*\.path' "$RUNNER_TEMP/qug-protected-trust-root-r1.yml"
          grep -Fq 'FAIL_PRIVATE_DANGEROUS_GIT_CONFIG_BEFORE_MATERIALIZATION' "$RUNNER_TEMP/qug-protected-trust-root-r1.yml"
          grep -Fq 'GIT_CONFIG_NOSYSTEM=1' "$RUNNER_TEMP/qug-protected-trust-root-r1.yml"
          grep -Fq 'if: ${{ false }}' "$RUNNER_TEMP/qug-protected-trust-root-r1.yml"
          grep -Fq 'test_r13_vercel_status_uses_creator_avatar' "$RUNNER_TEMP/test_control_authority_anchor.py"
          grep -Fq 'test_r13_ruleset_target_is_branch_in_both_authority_stages' "$RUNNER_TEMP/test_control_authority_anchor.py"
          grep -Fq 'test_r13_rejects_real_git_include_key_forms' "$RUNNER_TEMP/test_control_authority_anchor.py"
          grep -Fq 'test_r13_materialization_reestablishes_git_config_isolation_and_local_readback' "$RUNNER_TEMP/test_control_authority_anchor.py"

          if git ls-remote --exit-code --heads origin "refs/heads/$clean_branch" >/dev/null 2>&1; then
            echo "FAIL_CLOSED_CLEAN_R13_ALREADY_EXISTS" >&2
            exit 3
          fi

          git switch --detach "$base"
          git switch -c "$clean_branch"
          mkdir -p .github/workflows scripts
          cp "$RUNNER_TEMP/qug-protected-trust-root-r1.yml" "$workflow"
          cp "$RUNNER_TEMP/test_control_authority_anchor.py" "$tests"
          git add -- "$workflow" "$tests"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 2
          test "${staged[0]}" = "$workflow"
          test "${staged[1]}" = "$tests"

          git -c core.hooksPath=/dev/null \
              -c user.name="RUMBO Privacy Automation" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "fix(authority): close Codex P1 findings R13"

          clean_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$base"
          mapfile -t clean_changed < <(git diff --name-only "$base" "$clean_sha" | sort)
          test "${#clean_changed[@]}" -eq 2
          test "${clean_changed[0]}" = "$workflow"
          test "${clean_changed[1]}" = "$tests"

          git push --set-upstream origin "$clean_branch"
          test "$(git ls-remote origin "refs/heads/$clean_branch" | awk '{print $1}')" = "$clean_sha"

          test "$(git ls-remote origin "refs/heads/$source_branch" | awk '{print $1}')" = "$source_sha"
          test "$(git ls-remote origin "refs/heads/$bootstrap_branch" | awk '{print $1}')" = "$bootstrap_sha"
          git push origin --delete "$source_branch" "$bootstrap_branch"
          echo "CLEAN_R13_SHA=$clean_sha"
