name: RUMBO Control Authority bf1cf75 R12 Clean Rematerializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "docs/control-authority-anchor-v1.json"
      - "scripts/test_control_authority_anchor.py"
      - ".github/workflows/control-authority-bf1cf75-r12-bootstrap.yml"

permissions:
  contents: write

jobs:
  rematerialize:
    if: >-
      github.actor == 'fscfede-beep' &&
      github.event.pull_request.head.repo.full_name == 'RUMBO-IA/Rumbo' &&
      github.event.pull_request.head.ref == 'bootstrap/control-authority-bf1cf75-r12-20261007' &&
      github.event.pull_request.base.sha == '525b152bb6679db887c1d8c4f28bf993bda294ad'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact public base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 525b152bb6679db887c1d8c4f28bf993bda294ad
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source and rematerialize clean authority candidate
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="525b152bb6679db887c1d8c4f28bf993bda294ad"
          temp_branch="bootstrap/control-authority-bf1cf75-r12-20261007"
          clean_branch="fix/control-authority-select-bf1cf75-r12-20261007"
          anchor="docs/control-authority-anchor-v1.json"
          test_file="scripts/test_control_authority_anchor.py"
          private_sha="bf1cf75ea3e29e648daf70bb63562a66a9b8c9dd"
          private_tree="3b69701b56b0b1d98001a430e44b167d51174f75"

          [[ "$SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git ls-remote origin "refs/heads/$temp_branch" | awk '{print $1}')" = "$SOURCE_HEAD"
          git fetch origin "$SOURCE_HEAD" --quiet

          mapfile -t changed < <(git diff --name-only "$base" "$SOURCE_HEAD" | sort)
          expected=(
            ".github/workflows/control-authority-bf1cf75-r12-bootstrap.yml"
            "docs/control-authority-anchor-v1.json"
            "scripts/test_control_authority_anchor.py"
          )
          test "${#changed[@]}" -eq 3
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done

          git show "$SOURCE_HEAD:$anchor" > "$RUNNER_TEMP/anchor.json"
          git show "$SOURCE_HEAD:$test_file" > "$RUNNER_TEMP/test_control_authority_anchor.py"

          python3 - "$RUNNER_TEMP/anchor.json" "$RUNNER_TEMP/test_control_authority_anchor.py" "$private_sha" "$private_tree" <<'PY'
          import json,sys
          anchor_path,test_path,private_sha,private_tree=sys.argv[1:5]
          doc=json.load(open(anchor_path,encoding="utf-8"))
          assert doc["schema"]=="rumbo.public-protected-authority-anchor/v1"
          assert doc["public_authority"]["repository"]=="RUMBO-IA/Rumbo"
          assert doc["public_authority"]["branch"]=="main"
          assert doc["subject"]["repository"]=="RUMBO-IA/rumbo-control-queue"
          assert doc["subject"]["authorized_main_sha"]==private_sha
          assert doc["subject"]["authorized_tree_sha"]==private_tree
          assert doc["selection_semantics"]["private_main_may_drift_without_changing_canon"] is True
          assert doc["policy"]["production"]=="NO_GO"
          assert doc["policy"]["external_spend_usd"]==0
          text=open(test_path,encoding="utf-8").read()
          assert text.count(private_sha)==1
          assert text.count(private_tree)==1
          print("BOOTSTRAP_SOURCE_CONTRACT=PASS")
          PY

          if git ls-remote --exit-code --heads origin "refs/heads/$clean_branch" >/dev/null 2>&1; then
            echo "FAIL_CLOSED_CLEAN_BRANCH_ALREADY_EXISTS" >&2
            exit 3
          fi

          git switch --detach "$base"
          git switch -c "$clean_branch"
          cp "$RUNNER_TEMP/anchor.json" "$anchor"
          cp "$RUNNER_TEMP/test_control_authority_anchor.py" "$test_file"
          git add -- "$anchor" "$test_file"
          git -c core.hooksPath=/dev/null \
              -c user.name="RUMBO Privacy Automation" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "fix(authority): select product-green private bf1cf75 R12"

          clean_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git diff --name-only "$base" "$clean_sha" | sort | paste -sd, -)" = "docs/control-authority-anchor-v1.json,scripts/test_control_authority_anchor.py"

          git push --set-upstream origin "$clean_branch"
          test "$(git ls-remote origin "refs/heads/$clean_branch" | awk '{print $1}')" = "$clean_sha"
          test "$(git ls-remote origin "refs/heads/$temp_branch" | awk '{print $1}')" = "$SOURCE_HEAD"
          git push origin --delete "$temp_branch"

          echo "CLEAN_R12_SHA=$clean_sha"
          echo "BOOTSTRAP_BRANCH_CLEANUP=PASS"
          echo "EXTERNAL_SPEND_USD=0"
          echo "PRODUCTION=NO_GO"
