name: Scope Binding Reference

on:
  pull_request:
    paths:
      - "research/agent-reliability/scope-binding/**"
      - ".github/workflows/scope-binding-reference.yml"
  push:
    branches:
      - main
    paths:
      - "research/agent-reliability/scope-binding/**"
      - ".github/workflows/scope-binding-reference.yml"

permissions:
  contents: read

concurrency:
  group: scope-binding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Reject tracked Python cache
        shell: bash
        run: test -z "$(git ls-files | grep -E '(__pycache__/|\.pyc$)' || true)"
      - name: Run regression suite
        run: python -m unittest discover -s research/agent-reliability/scope-binding -p "test_*.py" -v
