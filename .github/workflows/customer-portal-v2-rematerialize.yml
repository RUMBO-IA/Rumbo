name: RUMBO Customer Portal V2 Rematerializer
on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/customer-portal-v2-rematerialize.yml"
permissions:
  contents: write
jobs:
  cleanup:
    if: >-
      github.actor == 'fscfede-beep' &&
      github.event.pull_request.head.repo.full_name == 'RUMBO-IA/Rumbo' &&
      github.event.pull_request.head.ref == 'bootstrap/customer-portal-v2-rematerialize-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete failed bootstrap branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE repos/RUMBO-IA/Rumbo/git/refs/heads/bootstrap/customer-portal-v2-rematerialize-20261004
          echo "BOOTSTRAP_BRANCH_DELETED=PASS"
