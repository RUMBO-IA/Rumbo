name: RUMBO Grok Plugin Adapter (static only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'openai-publication/agent-reliability/plugin/**'
      - 'openai-publication/agent-reliability/GROK_CLAUDE_MARKETPLACE_ADAPTER_20261015.md'
      - 'scripts/verify_grok_plugin_adapter.py'
      - 'scripts/test_verify_grok_plugin_adapter.py'
      - '.github/workflows/grok-plugin-adapter.yml'

permissions:
  contents: read

jobs:
  static-skill-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Six positive/adversarial regression cases
        run: python -m unittest -v scripts.test_verify_grok_plugin_adapter
      - name: Check actual candidate tree (does not authorize publication)
        run: python scripts/verify_grok_plugin_adapter.py
      - name: Re-run existing Agent Reliability publication source tests
        run: python -m unittest -v scripts.test_verify_agent_reliability_publication
