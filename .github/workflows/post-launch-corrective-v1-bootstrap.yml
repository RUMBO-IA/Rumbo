name: RUMBO Post-Launch Corrective V1 Clean Rematerializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/post-launch-corrective-v1-bootstrap.yml"
      - "index.html"
      - "login.html"
      - "portal.js"

permissions:
  contents: write

jobs:
  rematerialize:
    if: >-
      github.actor == 'fscfede-beep' &&
      github.event.pull_request.head.repo.full_name == 'RUMBO-IA/Rumbo' &&
      github.event.pull_request.head.ref == 'bootstrap/post-launch-corrective-v1-20261005' &&
      github.event.pull_request.base.sha == 'bbfcd95a986c5c617abfdf25b1ac769e7a7a9b3e'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bbfcd95a986c5c617abfdf25b1ac769e7a7a9b3e
          fetch-depth: 0
          persist-credentials: true
      - name: Rematerialize exact post-launch correction
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          temp_branch="bootstrap/post-launch-corrective-v1-20261005"
          clean_branch="fix/post-launch-corrective-v1-clean-20261005"
          base="bbfcd95a986c5c617abfdf25b1ac769e7a7a9b3e"
          bootstrap=".github/workflows/post-launch-corrective-v1-bootstrap.yml"

          [[ "$SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git ls-remote origin "refs/heads/$temp_branch" | awk '{print $1}')" = "$SOURCE_HEAD"
          if git ls-remote --exit-code --heads origin "refs/heads/$clean_branch" >/dev/null 2>&1; then
            echo "FAIL_CLOSED_CLEAN_BRANCH_EXISTS" >&2
            exit 3
          fi

          git fetch origin "$SOURCE_HEAD" --quiet
          mapfile -t changed < <(git diff --name-only "$base" "$SOURCE_HEAD" | sort)
          expected=("$bootstrap" "index.html" "login.html" "portal.js")
          test "${#changed[@]}" -eq 4
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done

          git show "$SOURCE_HEAD:index.html" | grep -Fq '<strong>Datos demostrativos.</strong> Demo y ejemplos con datos simulados. No representan resultados ni métricas de clientes reales.'
          ! git show "$SOURCE_HEAD:index.html" | grep -Fq 'Vista candidata.'
          ! git show "$SOURCE_HEAD:login.html" | grep -Fq 'Continue with Google'
          ! git show "$SOURCE_HEAD:login.html" | grep -Fq 'Google OAuth provider'
          ! git show "$SOURCE_HEAD:portal.js" | grep -Fq 'function handleGoogle()'
          ! git show "$SOURCE_HEAD:portal.js" | grep -Fq "google-button"

          git switch --detach "$base"
          git switch -c "$clean_branch"
          for path in index.html login.html portal.js; do
            git show "$SOURCE_HEAD:$path" > "$path"
          done
          git add -- index.html login.html portal.js

          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected_clean=("index.html" "login.html" "portal.js")
          test "${#staged[@]}" -eq 3
          for i in "${!expected_clean[@]}"; do test "${staged[$i]}" = "${expected_clean[$i]}"; done

          git -c core.hooksPath=/dev/null               -c user.name="RUMBO Privacy Automation"               -c user.email="41898282+github-actions[bot]@users.noreply.github.com"               commit -m "fix(web): close post-launch auth and copy defects"

          clean_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$base"
          meta="$(git show -s --format='%an|%ae|%cn|%ce' HEAD)"
          test "$meta" = "RUMBO Privacy Automation|41898282+github-actions[bot]@users.noreply.github.com|RUMBO Privacy Automation|41898282+github-actions[bot]@users.noreply.github.com"

          git push --set-upstream origin "$clean_branch"
          test "$(git ls-remote origin "refs/heads/$clean_branch" | awk '{print $1}')" = "$clean_sha"
          git push origin --delete "$temp_branch"
          echo "CLEAN_POST_LAUNCH_CORRECTIVE_V1_SHA=$clean_sha"
