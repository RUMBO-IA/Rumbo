name: RUMBO QUG Trust Root R11 P1 Rematerializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/qug-protected-trust-root-r1.yml"
      - "scripts/test_control_authority_anchor.py"
      - ".github/workflows/qug-trust-root-r11-bootstrap.yml"

permissions:
  contents: write

jobs:
  focused-tests:
    if: >-
      github.actor == 'fscfede-beep' &&
      github.event.pull_request.head.repo.full_name == 'RUMBO-IA/Rumbo' &&
      github.event.pull_request.head.ref == 'bootstrap/qug-trust-root-r11-p1-20261004' &&
      github.event.pull_request.base.sha == '68476a8e179d8db803bd3daeefa69a42a63fa098'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run R11 focused P1 contracts
        run: >-
          python -m unittest -v
          scripts.test_control_authority_anchor.ControlAuthorityAnchorTests.test_qug_trust_root_pins_ruleset_snapshot_and_rejects_exclusions
          scripts.test_control_authority_anchor.ControlAuthorityAnchorTests.test_qug_precarrier_requires_visible_empty_bypass_actor_set
          scripts.test_control_authority_anchor.ControlAuthorityAnchorTests.test_qug_private_fetch_validates_origin_and_protocol_before_fetch
      - name: Run full authority suite
        run: python -m unittest scripts.test_control_authority_anchor -v

  rematerialize:
    needs: focused-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact public base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 68476a8e179d8db803bd3daeefa69a42a63fa098
          fetch-depth: 0
          persist-credentials: true
      - name: Verify R11 and rematerialize clean
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          temp_branch="bootstrap/qug-trust-root-r11-p1-20261004"
          clean_branch="fix/qug-protected-trust-root-clean-r11-20261004"
          wf=".github/workflows/qug-protected-trust-root-r1.yml"
          tst="scripts/test_control_authority_anchor.py"

          [[ "$SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git ls-remote origin "refs/heads/$temp_branch" | awk '{print $1}')" = "$SOURCE_HEAD"
          git fetch origin "$SOURCE_HEAD" --quiet

          mapfile -t changed < <(git diff --name-only "68476a8e179d8db803bd3daeefa69a42a63fa098" "$SOURCE_HEAD" | sort)
          expected=(
            ".github/workflows/qug-protected-trust-root-r1.yml"
            ".github/workflows/qug-trust-root-r11-bootstrap.yml"
            "scripts/test_control_authority_anchor.py"
          )
          test "${#changed[@]}" -eq 3
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done

          git show "$SOURCE_HEAD:$wf" > "$RUNNER_TEMP/workflow.yml"
          git show "$SOURCE_HEAD:$tst" > "$RUNNER_TEMP/test.py"

          grep -Fq 'EXPECTED_RULESET_UPDATED_AT = "2026-10-01T00:55:26.160-03:00"' "$RUNNER_TEMP/workflow.yml"
          grep -Fq 'FAIL_RULESET_EXCLUSIONS_BEFORE_CARRIER' "$RUNNER_TEMP/workflow.yml"
          grep -Fq 'FAIL_RULESET_BYPASS_VISIBILITY_BEFORE_CARRIER' "$RUNNER_TEMP/workflow.yml"
          grep -Fq 'FAIL_PRIVATE_ORIGIN_MISMATCH' "$RUNNER_TEMP/workflow.yml"
          grep -Fq 'protocol\..*\.allow' "$RUNNER_TEMP/workflow.yml"
          grep -Fq 'if: ${{ false }}' "$RUNNER_TEMP/workflow.yml"
          grep -Fq 'test_qug_private_fetch_validates_origin_and_protocol_before_fetch' "$RUNNER_TEMP/test.py"

          if git ls-remote --exit-code --heads origin "refs/heads/$clean_branch" >/dev/null 2>&1; then
            echo "FAIL_CLOSED_R11_ALREADY_EXISTS" >&2
            exit 3
          fi

          git switch --detach "68476a8e179d8db803bd3daeefa69a42a63fa098"
          git switch -c "$clean_branch"
          mkdir -p .github/workflows scripts
          cp "$RUNNER_TEMP/workflow.yml" "$wf"
          cp "$RUNNER_TEMP/test.py" "$tst"
          git add -- "$wf" "$tst"
          git -c core.hooksPath=/dev/null \
              -c user.name="RUMBO Privacy Automation" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "fix(authority): close R10 trust-root P1 findings R11"
          clean_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "68476a8e179d8db803bd3daeefa69a42a63fa098"
          git push --set-upstream origin "$clean_branch"
          test "$(git ls-remote origin "refs/heads/$clean_branch" | awk '{print $1}')" = "$clean_sha"

          test "$(git ls-remote origin "refs/heads/$temp_branch" | awk '{print $1}')" = "$SOURCE_HEAD"
          git push origin --delete "$temp_branch"
          echo "CLEAN_R11_SHA=$clean_sha"
