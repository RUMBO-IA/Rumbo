name: Public privacy gate

on:
  pull_request:
    branches: [main]
  push:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run privacy gate regression tests
        run: python scripts/test_verify_public_privacy.py
      - name: Resolve GitHub-managed head identity
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          managed=0
          managed_sha=""
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            author_login="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq '.author.login // ""')"
            committer_login="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq '.committer.login // ""')"
            verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq '.commit.verification.verified // false')"
            reason="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq '.commit.verification.reason // ""')"
            if [[ "$author_login" == "$GITHUB_REPOSITORY_OWNER" && "$committer_login" == "web-flow" && "$verified" == "true" && "$reason" == "valid" ]]; then
              managed=1
              managed_sha="$COMMIT_SHA"
            fi
          fi
          echo "RUMBO_GITHUB_MANAGED_COMMIT=$managed" >> "$GITHUB_ENV"
          echo "RUMBO_GITHUB_MANAGED_SHA=$managed_sha" >> "$GITHUB_ENV"
      - name: Verify public privacy invariants
        env:
          RUMBO_PRIVACY_DENY_HASHES: ${{ secrets.RUMBO_PRIVACY_DENY_HASHES }}
          RUMBO_PRIVACY_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUMBO_GITHUB_EVENT_NAME: ${{ github.event_name }}
          RUMBO_GITHUB_REF: ${{ github.ref }}
          RUMBO_GITHUB_ACTOR: ${{ github.actor }}
          RUMBO_GITHUB_SENDER: ${{ github.event.sender.login }}
          RUMBO_GITHUB_FORCED: ${{ github.event.forced }}
        run: python scripts/verify_public_privacy.py
      - name: Test commercial coherence verifier
        run: python -m unittest scripts/test_verify_commercial_coherence.py
      - name: Verify commercial coherence
        run: python scripts/verify_commercial_coherence.py
      - name: Verify security headers configuration
        run: python scripts/verify_security_headers.py
