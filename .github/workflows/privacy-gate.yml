name: Public privacy gate

on:
  pull_request:
    branches: [main]
  push:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run brand contract regression tests
        run: python -m unittest scripts.test_verify_brand_contract
      - name: Verify brand contract
        run: python scripts/verify_brand_contract.py
      - name: Run privacy gate regression tests
        run: python scripts/test_verify_public_privacy.py
      - name: Verify public privacy invariants
        env:
          RUMBO_PRIVACY_DENY_HASHES: ${{ secrets.RUMBO_PRIVACY_DENY_HASHES }}
          RUMBO_PRIVACY_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUMBO_PRIVACY_SCAN_ALL_REFS: '1'
        run: python scripts/verify_public_privacy.py
      - name: Test commercial coherence verifier
        run: python -m unittest scripts/test_verify_commercial_coherence.py
      - name: Verify commercial coherence
        run: python scripts/verify_commercial_coherence.py
      - name: Verify security headers configuration
        run: python scripts/verify_security_headers.py
      - name: Test public control authority anchor
        run: python -m unittest scripts.test_control_authority_anchor -v
      - name: Verify public control authority anchor offline
        run: python scripts/verify_control_authority_anchor.py --anchor docs/control-authority-anchor-v1.json --offline
      - name: Run dependency-free static policy regression when present
        shell: bash
        run: |
          set -euo pipefail
          test_file='scripts/ci-pilot/verify-static.test.mjs'
          policy_file='scripts/ci-pilot/verify-static.mjs'
          # Once this contract reaches main, future PR heads may not silently remove it.
          if git cat-file -e "refs/remotes/origin/main:$test_file" 2>/dev/null; then
            test -f "$test_file"
            test -f "$policy_file"
          fi
          if [[ -e "$test_file" || -e "$policy_file" ]]; then
            test -f "$test_file"
            test -f "$policy_file"
            # For this isolated static pilot, preserve the root build-free contract.
            test ! -e package.json
            test ! -e turbo.json
            node --version
            node -e "if(Number(process.versions.node.split('.')[0]) < 20) process.exit(1)"
            node --test "$test_file"
          else
            echo 'STATIC_POLICY_PILOT_NOT_PRESENT'
          fi
