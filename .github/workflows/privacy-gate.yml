name: Public privacy gate

on:
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]
  push:

permissions:
  contents: read

jobs:
  privacy:
    if: ${{ github.event_name != 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run brand contract regression tests
        run: python -m unittest scripts.test_verify_brand_contract
      - name: Verify brand contract
        run: python scripts/verify_brand_contract.py
      - name: Run privacy gate regression tests
        run: python scripts/test_verify_public_privacy.py
      # PR runs the public regression tests above, but never executes a
      # secret-dependent privacy scan with an absent deny-list. The private
      # scan is NOT satisfied on PR and must not be represented as such.
      # Secret-backed verification only on trusted main, never on PR or
      # non-main branch pushes. This is not a replacement for PR review.
      - name: Verify public privacy invariants (trusted main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          RUMBO_PRIVACY_DENY_HASHES: ${{ secrets.RUMBO_PRIVACY_DENY_HASHES }}
          RUMBO_PRIVACY_COMMIT_SHA: ${{ github.sha }}
          RUMBO_PRIVACY_SCAN_ALL_REFS: '1'
        run: python scripts/verify_public_privacy.py
      - name: Test commercial coherence verifier
        run: python -m unittest scripts/test_verify_commercial_coherence.py
      - name: Verify commercial coherence
        run: python scripts/verify_commercial_coherence.py
      - name: Verify security headers configuration
        run: python scripts/verify_security_headers.py
      - name: Test public control authority anchor
        run: python -m unittest scripts.test_control_authority_anchor -v
      - name: Verify public control authority anchor offline
        run: python scripts/verify_control_authority_anchor.py --anchor docs/control-authority-anchor-v1.json --offline

  # Trusted base code + untrusted candidate data. Never execute candidate scripts.
  # The workflow definition for pull_request_target comes from the protected base.
  privacy-private-pr:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout trusted base verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout untrusted candidate as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Install trusted Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Scan candidate data using trusted base verifier
        env:
          RUMBO_PRIVACY_DENY_HASHES: ${{ secrets.RUMBO_PRIVACY_DENY_HASHES }}
          RUMBO_PRIVACY_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUMBO_PRIVACY_SCAN_ALL_REFS: '1'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          trusted = Path('trusted/scripts/verify_public_privacy.py').resolve()
          candidate = Path('candidate').resolve()
          if not trusted.is_file() or not (candidate / '.git').exists():
              raise SystemExit('PRIVACY_GATE_FAIL: missing trusted verifier or candidate checkout')
          spec = importlib.util.spec_from_file_location('trusted_public_privacy', trusted)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.ROOT = candidate
          raise SystemExit(module.main())
          PY
