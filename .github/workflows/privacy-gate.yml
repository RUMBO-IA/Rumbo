name: Public privacy gate

on:
  pull_request:
    branches: [main]
  push:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run privacy gate regression tests
        run: python scripts/test_verify_public_privacy.py
      - name: Verify public privacy invariants
        env:
          RUMBO_PRIVACY_DENY_HASHES: ${{ secrets.RUMBO_PRIVACY_DENY_HASHES }}
          RUMBO_PRIVACY_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/verify_public_privacy.py
      - name: Test commercial coherence verifier
        run: python -m unittest scripts/test_verify_commercial_coherence.py
      - name: Verify commercial coherence
        run: python scripts/verify_commercial_coherence.py
      - name: Verify security headers configuration
        run: python scripts/verify_security_headers.py
