name: Public privacy gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify public privacy invariants
        env:
          RUMBO_PRIVACY_DENY_HASHES: ${{ secrets.RUMBO_PRIVACY_DENY_HASHES }}
          RUMBO_PRIVACY_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/verify_public_privacy.py
      - name: Verify security headers configuration
        run: python scripts/verify_security_headers.py
