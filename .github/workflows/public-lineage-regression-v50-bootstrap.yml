name: RUMBO Public Lineage Regression V50 Clean Rematerializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/public-lineage-regression-v50-bootstrap.yml"
      - "index.html"
      - "vercel.json"
      - "scripts/verify_brand_contract.py"
      - "scripts/test_verify_brand_contract.py"
      - "scripts/verify_security_headers.py"

permissions:
  contents: write

jobs:
  rematerialize:
    if: >-
      github.actor == 'fscfede-beep' &&
      github.event.pull_request.head.repo.full_name == 'RUMBO-IA/Rumbo' &&
      github.event.pull_request.head.ref == 'fix/public-lineage-regression-v50-20261005' &&
      github.event.pull_request.base.sha == '71ffb752891563f689fc45c25810892e185b7c35'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 71ffb752891563f689fc45c25810892e185b7c35
          fetch-depth: 0
          persist-credentials: true
      - name: Validate source and rematerialize clean candidate
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          temp_branch="fix/public-lineage-regression-v50-20261005"
          clean_branch="fix/public-lineage-regression-v50-clean-20261005"
          base="71ffb752891563f689fc45c25810892e185b7c35"
          bootstrap=".github/workflows/public-lineage-regression-v50-bootstrap.yml"

          [[ "$SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git ls-remote origin "refs/heads/$temp_branch" | awk '{print $1}')" = "$SOURCE_HEAD"
          if git ls-remote --exit-code --heads origin "refs/heads/$clean_branch" >/dev/null 2>&1; then
            echo "FAIL_CLOSED_CLEAN_BRANCH_EXISTS" >&2
            exit 3
          fi

          git fetch origin "$SOURCE_HEAD" --quiet
          mapfile -t changed < <(git diff --name-only "$base" "$SOURCE_HEAD" | sort)
          allowed=("$bootstrap" "index.html" "scripts/test_verify_brand_contract.py" "scripts/verify_brand_contract.py" "scripts/verify_security_headers.py" "vercel.json")
          required=("$bootstrap" "index.html" "scripts/test_verify_brand_contract.py" "scripts/verify_brand_contract.py" "scripts/verify_security_headers.py")
          for path in "${changed[@]}"; do
            ok=0
            for candidate in "${allowed[@]}"; do
              if [[ "$path" == "$candidate" ]]; then ok=1; break; fi
            done
            test "$ok" -eq 1
          done
          for path in "${required[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$path"
          done

          for path in index.html scripts/test_verify_brand_contract.py scripts/verify_brand_contract.py scripts/verify_security_headers.py; do
            git show "$SOURCE_HEAD:$path" > "$path"
          done
          if printf '%s\n' "${changed[@]}" | grep -Fxq "vercel.json"; then
            git show "$SOURCE_HEAD:vercel.json" > vercel.json
          fi

          ! grep -Fq 'Vista candidata.' index.html
          grep -Fq '<strong>Datos demostrativos.</strong> Demo y ejemplos con datos simulados. No representan resultados ni métricas de clientes reales.' index.html
          python -m unittest scripts.test_verify_brand_contract -v
          python scripts/verify_brand_contract.py
          python scripts/verify_security_headers.py

          git switch --detach "$base"
          git switch -c "$clean_branch"
          for path in index.html vercel.json scripts/test_verify_brand_contract.py scripts/verify_brand_contract.py scripts/verify_security_headers.py; do
            git show "$SOURCE_HEAD:$path" > "$path"
          done
          git add -- index.html vercel.json scripts/test_verify_brand_contract.py scripts/verify_brand_contract.py scripts/verify_security_headers.py
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=("index.html" "scripts/test_verify_brand_contract.py" "scripts/verify_brand_contract.py" "scripts/verify_security_headers.py" "vercel.json")
          test "${#staged[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${staged[$i]}" = "${expected[$i]}"; done
          git diff --cached --check

          python -m unittest scripts.test_verify_brand_contract -v
          python scripts/verify_brand_contract.py
          python scripts/verify_security_headers.py

          git -c core.hooksPath=/dev/null \
              -c user.name="RUMBO Privacy Automation" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "fix(public): close lineage regression and legacy landing drift"

          clean_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$base"
          meta="$(git show -s --format='%an|%ae|%cn|%ce' HEAD)"
          test "$meta" = "RUMBO Privacy Automation|41898282+github-actions[bot]@users.noreply.github.com|RUMBO Privacy Automation|41898282+github-actions[bot]@users.noreply.github.com"

          git push --set-upstream origin "$clean_branch"
          test "$(git ls-remote origin "refs/heads/$clean_branch" | awk '{print $1}')" = "$clean_sha"
          git push origin --delete "$temp_branch"
          echo "CLEAN_PUBLIC_LINEAGE_V50_SHA=$clean_sha"
