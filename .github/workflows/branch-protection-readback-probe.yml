name: Branch Protection Readback Probe

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/branch-protection-readback-probe.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: >-
      github.actor == 'fscfede-beep' &&
      github.event.pull_request.head.repo.full_name == 'RUMBO-IA/Rumbo' &&
      github.event.pull_request.head.ref == 'probe/branch-protection-readback-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete ephemeral probe branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE repos/RUMBO-IA/Rumbo/git/refs/heads/probe/branch-protection-readback-20261004
          echo "PROBE_BRANCH_DELETED=PASS"
