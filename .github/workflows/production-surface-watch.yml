name: RUMBO Production Surface Watch

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run production surface regression tests
        run: python -m unittest scripts.test_verify_public_production_surface
      - name: Verify authorized production surface
        run: python scripts/verify_public_production_surface.py
