name: RUMBO Commercial Readiness V2 Clean Rematerializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/openai-commercial-readiness-v2-bootstrap.yml"
      - "docs/openai/COMMERCIAL_PLATFORM_V1.md"
      - "docs/openai/openai_readiness_v1.json"
      - "platform/schema/commercial_control_plane_v1.sql"

permissions:
  contents: write

jobs:
  rematerialize:
    if: >-
      github.actor == 'fscfede-beep' &&
      github.event.pull_request.head.repo.full_name == 'RUMBO-IA/Rumbo' &&
      github.event.pull_request.head.ref == 'bootstrap/openai-commercial-readiness-v2-20261004' &&
      github.event.pull_request.base.sha == '68476a8e179d8db803bd3daeefa69a42a63fa098'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact public base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 68476a8e179d8db803bd3daeefa69a42a63fa098
          fetch-depth: 0
          persist-credentials: true

      - name: Rematerialize corrected commercial candidate
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          temp_branch="bootstrap/openai-commercial-readiness-v2-20261004"
          old_clean_branch="feat/openai-commercial-readiness-v1-clean"
          old_clean_sha="cc542b761be5dea1e175fd24de7682be5e132108"
          new_clean_branch="feat/openai-commercial-readiness-v2-clean"
          base="68476a8e179d8db803bd3daeefa69a42a63fa098"
          bootstrap=".github/workflows/openai-commercial-readiness-v2-bootstrap.yml"
          docs_a="docs/openai/COMMERCIAL_PLATFORM_V1.md"
          docs_b="docs/openai/openai_readiness_v1.json"
          sql="platform/schema/commercial_control_plane_v1.sql"

          [[ "$SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git ls-remote origin "refs/heads/$temp_branch" | awk '{print $1}')" = "$SOURCE_HEAD"
          test "$(git ls-remote origin "refs/heads/$old_clean_branch" | awk '{print $1}')" = "$old_clean_sha"
          if git ls-remote --exit-code --heads origin "refs/heads/$new_clean_branch" >/dev/null 2>&1; then
            echo "FAIL_CLOSED_NEW_CLEAN_BRANCH_EXISTS" >&2
            exit 3
          fi

          git fetch origin "$SOURCE_HEAD" "$old_clean_sha" --quiet

          mapfile -t source_changed < <(git diff --name-only "$base" "$SOURCE_HEAD" | sort)
          expected=("$bootstrap" "$docs_a" "$docs_b" "$sql")
          test "${#source_changed[@]}" -eq 4
          for i in "${!expected[@]}"; do test "${source_changed[$i]}" = "${expected[$i]}"; done

          test "$(git show "$SOURCE_HEAD:$docs_a" | git hash-object --stdin)" = "$(git show "$old_clean_sha:$docs_a" | git hash-object --stdin)"
          test "$(git show "$SOURCE_HEAD:$docs_b" | git hash-object --stdin)" = "$(git show "$old_clean_sha:$docs_b" | git hash-object --stdin)"

          git show "$SOURCE_HEAD:$sql" > "$RUNNER_TEMP/sql-new"
          git show "$old_clean_sha:$sql" > "$RUNNER_TEMP/sql-old"
          grep -Fq "role_key text not null" "$RUNNER_TEMP/sql-new"
          ! grep -Fq "check (role in" "$RUNNER_TEMP/sql-new"
          test "$(cmp -l "$RUNNER_TEMP/sql-old" "$RUNNER_TEMP/sql-new" | wc -l)" -gt 0

          git switch --detach "$base"
          git switch -c "$new_clean_branch"
          for path in "$docs_a" "$docs_b" "$sql"; do
            mkdir -p "$(dirname "$path")"
            git show "$SOURCE_HEAD:$path" > "$path"
          done
          git add -- "$docs_a" "$docs_b" "$sql"

          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected_clean=("$docs_a" "$docs_b" "$sql")
          test "${#staged[@]}" -eq 3
          for i in "${!expected_clean[@]}"; do test "${staged[$i]}" = "${expected_clean[$i]}"; done

          git -c core.hooksPath=/dev/null               -c user.name="RUMBO Privacy Automation"               -c user.email="41898282+github-actions[bot]@users.noreply.github.com"               commit -m "feat(platform): rematerialize corrected OpenAI commercial readiness candidate"

          clean_sha="$(git rev-parse HEAD)"
          meta="$(git show -s --format='%an|%ae|%cn|%ce' HEAD)"
          test "$meta" = "RUMBO Privacy Automation|41898282+github-actions[bot]@users.noreply.github.com|RUMBO Privacy Automation|41898282+github-actions[bot]@users.noreply.github.com"

          git push --set-upstream origin "$new_clean_branch"
          test "$(git ls-remote origin "refs/heads/$new_clean_branch" | awk '{print $1}')" = "$clean_sha"

          git push origin --delete "$old_clean_branch"
          git push origin --delete "$temp_branch"
          echo "CLEAN_COMMERCIAL_V2_SHA=$clean_sha"
